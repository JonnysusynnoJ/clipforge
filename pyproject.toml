[project]
name = "clipforge"
version = "0.1.0"
description = "Semi-automated clipping pipeline for Whop Content Rewards campaigns"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "faster-whisper>=1.2.1",
    "librosa>=1.0.0",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pydantic>=2.7",
    "pydantic-settings[yaml]>=2.3",
    "pyyaml>=6.0",
    "rich>=13.7",
    "scenedetect[opencv-headless]>=0.7.2",
    "sqlmodel>=0.0.21",
    "structlog>=24.1",
    "typer>=0.12",
]

[project.scripts]
clipforge = "clipforge.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.2",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clipforge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "N"]

[tool.ruff.lint.per-file-ignores]
"clipforge/migrations/versions/*.py" = ["E501", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["clipforge", "tests"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["clipforge/migrations/versions/"]

# Strict typing for the domain core.
[[tool.mypy.overrides]]
module = ["clipforge.core", "clipforge.core.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
